schema_version = "1.0.0"

id = "blender_mcp_ultra"
version = "3.0.1"
name = "blender-mcp-ultra"
tagline = "Control total de Blender para agentes IA vía MCP"
maintainer = "carlosh7"
type = "add-on"
website = "https://github.com/carlosh7/blender-mcp"

tags = ["Interface", "Development", "Modeling", "Animation"]

blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]

[permissions]
network = "Servidor socket local (localhost:9876) para el puente MCP"
files = "Guardar snapshots, renders y screenshots en /tmp"

[build]
paths_exclude_pattern = [
    "__pycache__/",
    ".*.pyc",
    "tests/",
    "docs/",
    "benchmarks/",
    "data/",
    "skills/",
]
