name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Docs de tools en sync (scripts/gen_tools_docs.py)
        run: |
          pip install -e . --no-deps
          python scripts/gen_tools_docs.py
          git diff --exit-code docs/TOOLS.md

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 incluido: verificar soporte declarado (ver ACTION_PLAN P1.11)
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Install Blender 5.1 (para e2e reales)
        run: |
          wget -q https://download.blender.org/release/Blender5.1/blender-5.1.2-linux-x64.tar.xz
          tar -xf blender-5.1.2-linux-x64.tar.xz
          echo "$PWD/blender-5.1.2-linux-x64" >> $GITHUB_PATH

      - name: Start headless MCP server
        run: |
          blender -b --factory-startup --python scripts/headless_server_ci.py > /tmp/blender_ci.log 2>&1 &
          for i in $(seq 1 30); do
            nc -z localhost 9876 && break || sleep 2
          done
          nc -z localhost 9876 || { cat /tmp/blender_ci.log; exit 1; }

      - name: Run tests (e2e incluidos contra Blender headless) + coverage
        run: pytest -q --cov=mcp_ultra --cov=blender_mcp --cov-report=term --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Stop Blender
        if: always()
        run: pkill blender || true

  test-os:
    # Cross-OS: unit + e2e con Blender headless (descarga oficial por SO).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: '3.12'
            blender: blender-5.1.2-windows-x64.zip
          - os: macos-latest
            python-version: '3.12'
            blender: blender-5.1.2-macos-arm64.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Download Blender 5.1
        run: curl -L -o blender.pkg "https://download.blender.org/release/Blender5.1/${{ matrix.blender }}"

      - name: Extract Blender (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive blender.pkg -DestinationPath blender_dist
          echo "$PWD/blender_dist/blender-5.1.2-windows-x64" >> $env:GITHUB_PATH

      - name: Extract Blender (macos)
        if: runner.os == 'macOS'
        run: |
          hdiutil attach blender.pkg -mountpoint /Volumes/blender -nobrowse
          cp -R /Volumes/blender/Blender/blender.app /Applications/
          hdiutil detach /Volumes/blender
          echo "/Applications/blender.app/Contents/MacOS" >> $GITHUB_PATH

      - name: Start headless MCP server
        run: |
          blender -b --factory-startup --python scripts/headless_server_ci.py > /tmp/blender_ci.log 2>&1 &
          for i in $(seq 1 30); do
            python -c "import socket;socket.create_connection(('localhost',9876),1)" && break || sleep 2
          done

      - name: Run unit + integration + e2e
        run: pytest tests/unit tests/integration tests/e2e -q

      - name: Stop Blender
        if: always()
        run: pkill blender || true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools and package
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
          pip install -e .

      - name: Bandit (falla en severidad MEDIUM+)
        # Skips JUSTIFICADOS (by-design del producto, ver pyproject [tool.bandit]):
        # B102/B307 exec/eval es la función central (protegida por validator+token),
        # B310 descargas de APIs de assets, B108 rutas /tmp de Blender
        run: bandit -q -ll --skip B102,B307,B310,B108 -r mcp_ultra addon blender_mcp mcp_server.py blender_connection.py

      - name: pip-audit (dependencias del proyecto)
        run: pip-audit --skip-editable --progress-spinner off
