name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 incluido: verificar soporte declarado (ver ACTION_PLAN P1.11)
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Install Blender 5.1 (para e2e reales)
        run: |
          wget -q https://download.blender.org/release/Blender5.1/blender-5.1.2-linux-x64.tar.xz
          tar -xf blender-5.1.2-linux-x64.tar.xz
          echo "$PWD/blender-5.1.2-linux-x64" >> $GITHUB_PATH

      - name: Start headless MCP server
        run: |
          blender -b --factory-startup --python scripts/headless_server_ci.py > /tmp/blender_ci.log 2>&1 &
          for i in $(seq 1 30); do
            nc -z localhost 9876 && break || sleep 2
          done
          nc -z localhost 9876 || { cat /tmp/blender_ci.log; exit 1; }

      - name: Run tests (e2e incluidos contra Blender headless)
        run: pytest -q

      - name: Stop Blender
        if: always()
        run: pkill blender || true

  test-os:
    # Validación cross-OS de la lógica pura (sin e2e de Blender, que se prueba
    # en ubuntu arriba). Cubre rutas temporales, paths y comportamiento base.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run unit tests
        run: pytest tests/unit -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools and package
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
          pip install -e .

      - name: Bandit (falla en severidad MEDIUM+)
        # Skips JUSTIFICADOS (by-design del producto, ver pyproject [tool.bandit]):
        # B102/B307 exec/eval es la función central (protegida por validator+token),
        # B310 descargas de APIs de assets, B108 rutas /tmp de Blender
        run: bandit -q -ll --skip B102,B307,B310,B108 -r src addon

      - name: pip-audit (dependencias del proyecto)
        run: pip-audit --skip-editable --progress-spinner off
