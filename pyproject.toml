[project]
name = "blender-mcp-ultra"
version = "3.0.1"
description = "The most complete MCP server for Blender — 217 tools, 19 skills, enterprise security"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "CarlosH", email = "carlos@antigravity.dev"}
]
keywords = ["mcp", "blender", "3d", "ai", "llm", "model-context-protocol", "3d-modeling"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "mcp[cli]>=1.3.0,<2",
    "requests>=2.25.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
dev = [
    "blender-mcp-ultra[test]",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
blender-mcp = "blender_mcp.cli:main"
blender-mcp-server = "src.presentation.mcp_server:main"
blender-mcp-adapter = "mcp_adapter:main"

[project.urls]
Homepage = "https://github.com/carlosh7/blender-mcp-ultra"
Repository = "https://github.com/carlosh7/blender-mcp-ultra"
Issues = "https://github.com/carlosh7/blender-mcp-ultra/issues"
Documentation = "https://github.com/carlosh7/blender-mcp-ultra#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blender_mcp", "addon", "src"]
force-include = {"mcp_adapter.py" = "mcp_adapter.py"}

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "addon/",
    "skills/",
    "mcp_adapter.py",
    "mcp_server.py",
    "blender_connection.py",
    "config.py",
    "start_server.py",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
]

[tool.bandit]
# Exclusiones JUSTIFICADAS (by-design del producto, no descuidos):
# - B102/B307: exec/eval es la función central del addon (ejecutar código
#   Blender desde agentes IA). Protegido por AxiomValidator/code_guard,
#   token X-API-Token y binding localhost (tests/unit/test_code_guard.py).
# - B310: urlopen de APIs de assets (PolyHaven/Sketchfab/Hyper3D) con URLs
#   https de la propia integración.
# - B108: rutas /tmp convencionales de Blender para caches/exports.
skips = ["B102", "B307", "B310", "B108"]
exclude_dirs = ["tests", "data", "skills"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "e2e: end-to-end tests that use real external processes (e.g., Blender)",
    "slow: tests that take more than 10 seconds",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# Deuda de estilo heredada (sin autofix disponible); revisar en futuras pasadas:
# - E701/E702/E402: one-liners e imports tardíos del código legacy
# - N801/N802/N806/N811/N818: convenciones de nombres legacy
# - UP035: re-exports de typing compatibles con Blender <3.9
# - F841: dead stores (29 sitios, requieren triage manual)
ignore = [
    "E501", "N999",
    "E701", "E702", "E402",
    "N801", "N802", "N806", "N811", "N818",
    "UP035", "F841",
]

[tool.ruff.lint.per-file-ignores]
"data/**" = ["F821", "N805", "E501"]
"skills/**" = ["F821"]
"**/__init__.py" = ["F401"]
# Agregador deliberado de creation_rules (re-export)
"addon/creation_rules_unified.py" = ["F403"]
# Wrappers multi-línea para --python-expr: .format con {!r} es intencional
"blender_mcp/blender_cli.py" = ["UP032"]
"blender_mcp/utils/launcher.py" = ["UP032"]
