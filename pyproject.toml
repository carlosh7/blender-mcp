[project]
name = "blender-mcp-ultra"
version = "1.0.0"
description = "The most complete MCP server for Blender — 118+ tools, 19 skills, enterprise security"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "CarlosH", email = "carlos@antigravity.dev"}
]
keywords = ["mcp", "blender", "3d", "ai", "llm", "model-context-protocol", "3d-modeling"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "mcp[cli]>=1.3.0",
    "requests>=2.25.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
dev = [
    "blender-mcp-ultra[test]",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
blender-mcp = "blender_mcp.cli:main"
blender-mcp-server = "blender_mcp.server:main"
blender-mcp-adapter = "mcp_adapter:main"

[project.urls]
Homepage = "https://github.com/carlosh7/blender-mcp-ultra"
Repository = "https://github.com/carlosh7/blender-mcp-ultra"
Issues = "https://github.com/carlosh7/blender-mcp-ultra/issues"
Documentation = "https://github.com/carlosh7/blender-mcp-ultra#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blender_mcp", "addon"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "addon/",
    "skills/",
    "mcp_adapter.py",
    "start_server.py",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "e2e: end-to-end tests that use real external processes (e.g., Blender)",
    "slow: tests that take more than 10 seconds",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N999"]
